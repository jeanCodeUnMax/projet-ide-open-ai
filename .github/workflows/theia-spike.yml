name: Theia Spike

on:
  push:
    paths:
      - 'theia/**'
      - 'tests/theia-spike-contract.test.mjs'
      - '.github/workflows/theia-spike.yml'
  pull_request:
    paths:
      - 'theia/**'
      - 'tests/theia-spike-contract.test.mjs'
      - '.github/workflows/theia-spike.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Theia workspace
        working-directory: theia
        run: yarn install --non-interactive --network-timeout 600000

      - name: Compile IDE-AI extension
        working-directory: theia
        run: yarn workspace @ide-ai/theia-core compile

      - name: Build Theia Electron application
        working-directory: theia
        run: yarn workspace ide-ai-theia-electron build
