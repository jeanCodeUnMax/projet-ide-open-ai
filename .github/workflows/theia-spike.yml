name: Theia Spike

on:
  push:
    paths:
      - 'theia/**'
      - 'tests/theia-spike-contract.test.mjs'
      - '.github/workflows/theia-spike.yml'
  pull_request:
    paths:
      - 'theia/**'
      - 'tests/theia-spike-contract.test.mjs'
      - '.github/workflows/theia-spike.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Theia workspace
        id: install
        continue-on-error: true
        working-directory: theia
        shell: bash
        run: |
          set -o pipefail
          yarn install --non-interactive --network-timeout 600000 2>&1 | tee theia-install.log

      - name: Upload Theia install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theia-install-log
          path: theia/theia-install.log
          if-no-files-found: warn

      - name: Stop after installation failure
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: Compile IDE-AI extension
        working-directory: theia
        run: yarn workspace @ide-ai/theia-core compile

      - name: Build Theia Electron application
        working-directory: theia
        run: yarn workspace ide-ai-theia-electron build
