name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee install-output.txt
      - name: Run checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee test-output.txt
      - name: Upload CI output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: |
            install-output.txt
            test-output.txt
          if-no-files-found: warn
